<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" readonly placeholder="0" />

      <div class="buttons">
        <button class="gray" onclick="clearDisplay()">AC</button>
        <button class="gray" onclick="toggleSign()">+/−</button>
        <button class="gray" onclick="add('%')">%</button>
        <button class="orange" onclick="add('/')">÷</button>

        <button class="dark" onclick="add('7')">7</button>
        <button class="dark" onclick="add('8')">8</button>
        <button class="dark" onclick="add('9')">9</button>
        <button class="orange" onclick="add('*')">×</button>

        <button class="dark" onclick="add('4')">4</button>
        <button class="dark" onclick="add('5')">5</button>
        <button class="dark" onclick="add('6')">6</button>
        <button class="orange" onclick="add('-')">−</button>

        <button class="dark" onclick="add('1')">1</button>
        <button class="dark" onclick="add('2')">2</button>
        <button class="dark" onclick="add('3')">3</button>
        <button class="orange" onclick="add('+')">+</button>
        <button class="dark"><i class="fa-solid fa-calculator"></i></button>
        <button class="dark" onclick="add('0')">0</button>
        
        <button class="dark" onclick="add('.')">.</button>
        <button class="orange" onclick="calculate()">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
